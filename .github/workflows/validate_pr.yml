name: "Validate PR"

# Runs with the unprivileged `pull_request` trigger so no write token or secrets
# are exposed to PR-controlled input. Commenting on the PR is handled by
# validate_pr_comment.yml, which runs via `workflow_run`.
on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: read

jobs:
  check-pr-title:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        id: lint_pr_title
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Hand the result to the commenting workflow. The error message derives from the
      # PR title, so it is passed via env and written to a file, never interpolated
      # into the script.
      - name: Write validation result
        if: always()
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ERROR_MESSAGE: ${{ steps.lint_pr_title.outputs.error_message }}
        run: |
          mkdir -p validation-result
          printf '%s' "$PR_NUMBER" > validation-result/pr-number
          if [ -n "$ERROR_MESSAGE" ]; then
            printf '%s' "$ERROR_MESSAGE" > validation-result/error-message
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: validation-title
          path: validation-result
          retention-days: 1

  enforce-packages:
    name: Prevent new files in `equinix` package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        id: check_added_files
        with:
          result-encoding: string
          retries: 3
          script: |
            const files = await github.paginate(github.rest.pulls.listFiles,{
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            })

            const blockedFiles = []

            for (const file of files) {
              if (file.status === "added" && file.filename.match(/equinix\/[^\/]*\.go/)) {
                blockedFiles.push("- " + file.filename)
              }
            }

            var errorMessage = ""

            if (blockedFiles.length > 0) {
               errorMessage = `The following files were added to the \`equinix\` package and must be moved somewhere else:
            ${blockedFiles.join("\n")}
            `
              core.setFailed(errorMessage)
            }

            return errorMessage

      # Hand the result to the commenting workflow (see the title check above).
      - name: Write validation result
        if: always()
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ERROR_MESSAGE: ${{ steps.check_added_files.outputs.result }}
        run: |
          mkdir -p validation-result
          printf '%s' "$PR_NUMBER" > validation-result/pr-number
          if [ -n "$ERROR_MESSAGE" ]; then
            printf '%s' "$ERROR_MESSAGE" > validation-result/error-message
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: validation-packages
          path: validation-result
          retention-days: 1
